
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08070c" />
  <title>Login | Sivexo Soft CRM</title>

  <link rel="icon" href="assets/images/logo.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script type="module" src="assets/js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="login-layout">
    <section class="login-brand">
      <img
        src="assets/images/logo.png"
        alt="Sivexo Soft"
        class="login-logo"
      />
      <p class="eyebrow">YOUR BUSINESS. YOUR PIPELINE.</p>
      <h1>Turn every lead<br />into an opportunity.</h1>
      <p class="muted">
        Manage prospects, follow-ups, services and sales
        from one private workspace.
      </p>
      <div class="brand-caption">CODE. DESIGN. GROW.</div>
    </section>

    <section class="login-card">
      <div class="mobile-logo">
        <img src="assets/images/logo.png" alt="Sivexo Soft logo" />
      </div>

      <span class="eyebrow">WELCOME BACK</span>
      <h2>Sign in to your CRM</h2>
      <p class="muted">Access your personal sales workspace.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="username"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          minlength="8"
          required
        />

        <button class="btn btn-primary full-width" type="submit">
          Sign in <span aria-hidden="true">→</span>
        </button>

        <p id="authMessage" class="form-message" role="status"></p>
      </form>

      <p class="auth-footer">
        Personal workspace · Sivexo Soft CRM
      </p>
    </section>
  </main>
</body>
</html>
